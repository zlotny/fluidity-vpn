name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          FLUIDITY_MANAGED_PREFERENCES: /nonexistent
      - if: runner.os == 'macOS'
        run: cargo build --release -p fluidity-ffi && cd macos && swift build
  linux-gtk:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
        working-directory: linux
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: linux
      - run: cargo test
        working-directory: linux
  windows-msi:
    runs-on: windows-latest
    env:
      GVSBUILD: "2026.8.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk
          key: gvsbuild-${{ env.GVSBUILD }}-vs18-gtk4-adwaita-rsvg
      - name: Build GTK
        shell: pwsh
        run: |
          if (-not (Test-Path C:\gtk-build\gtk\x64\release\lib\pkgconfig\libadwaita-1.pc)) {
            pip install "gvsbuild==$env:GVSBUILD"
            New-Item -ItemType Directory -Force C:\gtk-build\src | Out-Null
            Invoke-WebRequest https://deb.debian.org/debian/pool/main/p/pixman/pixman_0.46.4.orig.tar.gz -OutFile C:\gtk-build\src\pixman-0.46.4.tar.gz
            Invoke-WebRequest https://deb.debian.org/debian/pool/main/c/cairo/cairo_1.18.4.orig.tar.xz -OutFile C:\gtk-build\src\cairo-1.18.4.tar.xz
            for ($i = 1; $i -le 3; $i++) {
              gvsbuild build --vs-ver vs2026 gtk4 libadwaita librsvg adwaita-icon-theme
              if ($LASTEXITCODE -eq 0) { break }
              if ($i -eq 3) { exit $LASTEXITCODE }
              Start-Sleep -Seconds 30
            }
          }
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2
      - name: Build MSI
        shell: pwsh
        run: windows\build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fluidity-windows
          path: dist\windows\*.msi
