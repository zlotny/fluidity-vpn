[package]
name = "fluidity-gtk"
version = "1.0.0"
edition = "2024"
license = "0BSD"

[[bin]]
name = "fluidity-gtk"
path = "src/main.rs"

[dependencies]
fluidity-config = { path = "../crates/fluidity-config" }
fluidity-core = { path = "../crates/fluidity-core" }
fluidity-ipc = { path = "../crates/fluidity-ipc" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pangocairo = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["tokio"], default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
embed-resource = "3"

[workspace]
