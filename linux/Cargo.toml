[package]
name = "fluidity-gtk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "fluidity-gtk"
path = "src/main.rs"

[dependencies]
fluidity-config = { path = "../crates/fluidity-config" }
fluidity-core = { path = "../crates/fluidity-core" }
fluidity-ipc = { path = "../crates/fluidity-ipc" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
ksni = { version = "0.3", features = ["tokio"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pangocairo = "0.22"

[workspace]
