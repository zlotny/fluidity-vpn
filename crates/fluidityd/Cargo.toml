[package]
name = "fluidityd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluidity-config.workspace = true
fluidity-mgmt.workspace = true
fluidity-ipc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
clap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration.workspace = true
core-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
uuid.workspace = true
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry"] }

[dev-dependencies]
tempfile.workspace = true
